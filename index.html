<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout Log"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<title>Workout Log</title>
<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
/* Layout: Who = pick yourself -> Home = your workouts (tile grid) -> Workout = one exercise card at a time per tap, sets as rows */
:root{--bg:#f4f4f2;--card:#fff;--fg:#1c1917;--muted:#57534e;--line:#e0deda;--pri:#f97316;--on-pri:#1c1917;--acc:#c2410c;--good:#15803d;--on-good:#fff;--warn:#b91c1c;
--head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1f2430;--fg:#f8fafc;--muted:#b6c0cc;--line:#323a48;--acc:#fb923c;--good:#22c55e;--on-good:#0f172a;--warn:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1f2430;--fg:#f8fafc;--muted:#b6c0cc;--line:#323a48;--acc:#fb923c;--good:#22c55e;--on-good:#0f172a;--warn:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-inline:16px;padding-block:20px 96px;max-width:560px;margin-inline:auto}
h1,h2,h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
h1{font-size:2.25rem;font-weight:700}
h2{font-size:1.1rem;font-weight:600;color:var(--muted);margin-block:24px 10px}
h3{font-size:1.35rem;font-weight:600}
button,input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
button{cursor:pointer;min-height:48px;padding:0 16px;transition:background .15s,transform .15s}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sub{color:var(--muted);margin:4px 0 0}
.link{background:none;border:0;color:var(--acc);font-weight:600;min-height:44px;padding:0 4px;text-decoration:underline}
.hero{display:block;width:100%;text-align:left;background:var(--pri);color:var(--on-pri);border:0;padding:18px;margin-top:20px;min-height:0}
.hero small{display:block;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem}
.hero h3{font-size:2rem;margin-block:2px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:14px;min-height:84px}
.tile span{color:var(--muted);font-size:.85rem}
.tile.new{border-style:dashed;color:var(--acc);justify-content:center}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.recent{display:flex;justify-content:space-between;width:100%;text-align:left;margin-bottom:8px;min-height:56px;align-items:center}
.recent span{color:var(--muted);font-size:.9rem;white-space:nowrap}
/* workout */
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top .back{width:48px;padding:0;display:grid;place-items:center}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-block:14px 4px}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.ex>button.hd{width:100%;border:0;border-radius:0;background:none;display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;min-height:60px}
.ex .hd h3{flex:1;font-size:1.2rem;overflow-wrap:anywhere}
.ex .hd small{color:var(--muted);font-family:var(--body);font-size:.85rem;white-space:nowrap}
.ex.done .hd svg.ck{color:var(--good)}
.ex .chev{transition:transform .2s;color:var(--muted)}
.ex.open .chev{transform:rotate(180deg)}
.body{padding:0 14px 14px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.cols,.set{display:grid;grid-template-columns:28px 1fr 1fr 52px 40px;gap:8px;align-items:center}
.cols{color:var(--muted);font-size:.8rem;text-align:center;margin-bottom:4px}
.set{margin-bottom:8px}
.set b{text-align:center;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.set input{width:100%;height:52px;text-align:center;font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.set .ok{height:52px;padding:0;display:grid;place-items:center}
.set .ok[aria-pressed="true"]{background:var(--good);color:var(--on-good);border-color:var(--good)}
.set .del{padding:0;min-height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.row2{display:flex;gap:8px;margin-top:4px}
.row2 button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.row2 .rm{color:var(--warn)}
.addrow{display:flex;gap:8px;margin-top:20px}
.addrow input{flex:1;padding:0 14px;height:52px}
.primary{background:var(--pri);color:var(--on-pri);border-color:var(--pri);font-weight:600}
.finish{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.finish button{display:block;width:100%;max-width:560px;margin-inline:auto;font-size:1.05rem}
/* who */
.who{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.who .tile{min-height:92px;width:100%}
.who .tile h3{font-size:1.6rem}
.ren{display:flex;gap:8px;margin-top:6px}
.ren input{flex:1;height:48px;padding:0 12px}
.foot{margin-top:20px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><div id="app"></div>
<script>
/* Each member sees only their own workouts, today's plan and history on this phone.
   (This keeps views tidy; it is not a lock. Anyone holding the phone can switch member.) */
var DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function G(reps,names){return names.map(function(n){return[n,3,reps]})}          // 3 sets of `reps`
var STRETCH=function(n){return[n||"Stretching",1,1]};
var ONE=function(names){return names.map(function(n){return[n,1,1]})};            // cardio style: 1 x 1
// Plans as set by the gym from 11 Oct 2026. Edit here when the gym changes a plan.
var PEOPLE=[
{id:"1",name:"Mukesh",
 week:["Rest day","Intermediate Shoulder","Intermediate Back","Intermediate Chest","Intermediate Biceps","Intermediate Triceps","Intermediate Legs"],
 tpl:{
 "Intermediate Shoulder":G(12,["Shoulder Press (Dumbbell)","Standing Multi Fly (Pin Loaded)","Face Pull (Cable)","Shrugs (Plate)"]),
 "Intermediate Back":G(12,["Dead Lift","Mid Row","Bend Over Row (Barbell)","T Bar Rowing (Barbell)"]).concat([STRETCH()]),
 "Intermediate Chest":G(12,["Barbell Bench Press","Flat Fly (Dumbbell)","Incline Chest Press (Plate Loaded)","Pull Over (Dumbbell)","Push Ups (Till Failure)"]).concat([STRETCH("Chest Stretch")]),
 "Intermediate Biceps":G(12,["Incline Bicep Curl (Bench)","Barbell Bicep Curl","Concentration Curls","Hammer Curl (Cable)"]).concat([STRETCH()]),
 "Intermediate Triceps":G(12,["Skull Crushers","Standing Overhead Extension (Cable)","Kick Back (Dumbbell)","Triceps Dips (Bench)"]).concat([STRETCH()]),
 "Intermediate Legs":G(12,["Barbell Squats","Walking Lunges","V Squat Hercules","Hip Thruster","Seated Calf Machine"]).concat([STRETCH("Stretch (trainer)")])}},
{id:"2",name:"Keerthana",
 week:["Rest day","Chest & Shoulder","Cardio","Back & Biceps","Cardio","Legs & Triceps","Cardio"],
 tpl:{
 "Chest & Shoulder":G(12,["Incline Chest Press (Plate Loaded)","Pec Fly","Flat Bench","Shoulder Press (Dumbbell)","Lateral Raise"]).concat([STRETCH()]),
 "Cardio":ONE(["Incline Walking","Stair Climber","Rowing Machine","Spin Bike","Elliptical","Stretching"]),
 "Back & Biceps":G(12,["Dip / Chin Assist","Pull Over (Dumbbell)"]).concat(G(10,["Mid Row","Bicep Curl (Dumbbell)","Hammer Curl (Cable)"]),[STRETCH()]),
 "Legs & Triceps":G(12,["Barbell Squats","V Squat Hercules","Leg Press","Seated Calf Machine","Tricep Push Down (Cable)","Over Head Extension (Dumbbell)"])}}];
var LEGACY_RENAME={"Legs (Plan 1)":"Basic Legs","Back":"Basic Back","Chest":"Basic Chest","Shoulders":"Basic Shoulders","Biceps":"Basic Biceps","Triceps":"Basic Triceps"};

var IC={back:'<path d="M15 18l-6-6 6-6"/>',chev:'<path d="M6 9l6 6 6-6"/>',ck:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'};
function ic(n,c){return'<svg class="'+(c||"")+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
var DB,S,view="home",sess=null,open={},ren=null,msg="",$=function(i){return document.getElementById(i)};
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML.replace(/"/g,"&quot;")}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(d){var p=d.split("-");return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}
function save(){try{localStorage.setItem("wlog2",JSON.stringify(DB))}catch(e){}}
function person(id){return PEOPLE.filter(function(p){return p.id==id})[0]}
function nameOf(p){return(DB.names[p.id]||p.name)}
function me(){return person(DB.who)}
function load(){
 try{DB=JSON.parse(localStorage.getItem("wlog2"))}catch(e){}
 DB=DB||{};DB.who=DB.who||null;DB.names=DB.names||{};DB.p=DB.p||{};
 if(!person(DB.who))DB.who=null;
 view=DB.who?"home":"who";useProfile()}
function useProfile(){if(DB.who){DB.p[DB.who]=DB.p[DB.who]||{s:[]};S=DB.p[DB.who]}else S={s:[]}}
// Logs saved by older versions of this page live under another key. The first member to pick themselves on this phone takes them over.
function claimLegacy(){
 if(DB.legacyDone)return;DB.legacyDone=true;
 try{var o=JSON.parse(localStorage.getItem("wlog1"));
  if(o&&Array.isArray(o.s)&&o.s.length){o.s.forEach(function(q){if(LEGACY_RENAME[q.name])q.name=LEGACY_RENAME[q.name]});S.s=o.s.concat(S.s)}}catch(e){}}
function choose(id){DB.who=id;useProfile();claimLegacy();view="home";save();window.scrollTo(0,0);render()}

function mk(n,sets,reps){var a=[];for(var i=0;i<sets;i++)a.push({w:"",r:"",ok:0});return{n:n,t:reps>1?reps:"",s:a}}
function sets(x){return x.s.filter(function(s){return s.w||s.r||s.ok}).length}
function allDone(e){return e.s.length&&e.s.every(function(s){return s.ok})}
function last(n){var best=null;S.s.forEach(function(q){if(q===sess||q.date>today())return;q.ex.forEach(function(e){
 var s=e.s.filter(function(x){return x.w||x.r}).pop();if(e.n==n&&s&&(!best||q.date>=best.d))best={d:q.date,s:s}})});return best&&best.s}
function start(name,existing){
 sess=existing||S.s.filter(function(q){return q.date==today()&&q.name==name})[0];
 if(!sess){sess={date:today(),name:name,ex:(me().tpl[name]||[]).map(function(x){return mk(x[0],x[1],x[2])})};S.s.push(sess);save()}
 open={};var i=sess.ex.findIndex(function(e){return!allDone(e)});open[i<0?0:i]=1;view="work";window.scrollTo(0,0);render()}

function who(){
 var h='<h1>Who is training?</h1><p class="sub">Each member sees only their own workouts and history on this phone.</p><div class="who">';
 PEOPLE.forEach(function(p){var td=p.week[new Date().getDay()];
  h+='<div><button class="tile" data-a="pick" data-id="'+p.id+'"><h3>'+esc(nameOf(p))+'</h3><span>Today: '+esc(td)+'</span></button>'
   +(ren==p.id?'<div class="ren"><input id="rn" value="'+esc(nameOf(p))+'" maxlength="24" aria-label="Name"><button class="primary" data-a="rnsave" data-id="'+p.id+'">Save</button></div>'
    :'<button class="link" data-a="rn" data-id="'+p.id+'">Rename</button>')+'</div>'});
 return h+'</div>'}
function home(){
 var p=me(),tn=p.week[new Date().getDay()],h='<h1>Hi, '+esc(nameOf(p))+'</h1><p class="sub">'+fmt(today())+'</p>';
 if(tn!="Rest day"&&p.tpl[tn])h+='<button class="hero" data-a="go" data-n="'+esc(tn)+'"><small>Today\'s plan</small><h3>'+esc(tn)+'</h3>'+p.tpl[tn].length+' exercises · tap to start</button>';
 else h+='<div class="note"><span>Today is a rest day in your plan.</span></div>';
 h+='<h2>Your workouts</h2><div class="grid">'+Object.keys(p.tpl).map(function(k){
  return'<button class="tile" data-a="go" data-n="'+esc(k)+'"><h3>'+esc(k)+'</h3><span>'+p.tpl[k].length+' exercises</span></button>'}).join("")
  +'<button class="tile new" data-a="go" data-n="Custom workout">'+ic("plus")+'<h3>Build my own</h3></button></div>';
 var rec=S.s.filter(function(q){return q.ex.some(function(e){return sets(e)})}).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,4);
 if(rec.length)h+='<h2>Recent</h2>'+rec.map(function(q){var n=q.ex.reduce(function(a,e){return a+e.s.filter(function(s){return s.ok}).length},0);
  return'<button class="recent" data-a="open" data-id="'+S.s.indexOf(q)+'"><b>'+esc(q.name)+'</b><span>'+fmt(q.date)+' · '+n+' sets</span></button>'}).join("");
 h+='<h2>Your data</h2><div class="grid"><button class="tile" data-a="exp"><h3>Back up</h3><span>Save a file</span></button>'
  +'<label class="tile" style="cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--card)"><h3>Restore</h3><span>Load a backup</span><input id="imp" type="file" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0"></label></div>'
  +(msg?'<p class="sub" role="status" style="margin-top:10px">'+esc(msg)+'</p>':'');
 return h+'<div class="foot"><button class="link" data-a="switch">Not '+esc(nameOf(p))+'? Switch member</button></div>'}
function work(){
 var tot=0,dn=0;sess.ex.forEach(function(e){tot+=e.s.length;dn+=e.s.filter(function(s){return s.ok}).length});
 var h='<div class="top"><button class="back" data-a="home" aria-label="Back to workouts">'+ic("back")+'</button><div><h1 style="font-size:1.9rem">'+esc(sess.name)+'</h1><p class="sub" style="margin:0">'+fmt(sess.date)+'</p></div></div>'
 +'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+tot+'" aria-valuenow="'+dn+'"><i style="width:'+(tot?dn/tot*100:0)+'%"></i></div><p class="sub" style="margin:0 0 4px">'+dn+' of '+tot+' sets done</p>';
 h+=sess.ex.map(function(e,i){var l=last(e.n),o=open[i],d=e.s.filter(function(s){return s.ok}).length;
  return'<section class="ex'+(o?" open":"")+(allDone(e)?" done":"")+'" data-i="'+i+'"><button class="hd" data-a="tg" aria-expanded="'+!!o+'">'+(allDone(e)?ic("ck","ck"):"")+'<h3>'+esc(e.n)+'</h3><small>'+d+'/'+e.s.length+'</small>'+ic("chev","chev")+'</button>'
  +(o?'<div class="body"><p class="hint">'+(l?"Last time: "+(l.w||"–")+" kg × "+(l.r||"–")+" reps":"First time logging this exercise")+(e.t?" · plan: "+e.s.length+" sets × "+e.t+" reps":"")+'</p>'
   +'<div class="cols"><span>Set</span><span>Weight (kg)</span><span>Reps</span><span>Done</span><span></span></div>'
   +e.s.map(function(s,j){return'<div class="set" data-j="'+j+'"><b>'+(j+1)+'</b>'
    +'<input type="number" inputmode="decimal" step="any" min="0" data-f="w" value="'+s.w+'" placeholder="'+(l&&l.w||"")+'" aria-label="Weight in kg, set '+(j+1)+'">'
    +'<input type="number" inputmode="numeric" min="0" data-f="r" value="'+s.r+'" placeholder="'+(l&&l.r||e.t||"")+'" aria-label="Reps, set '+(j+1)+'">'
    +'<button class="ok" data-a="ok" aria-pressed="'+!!s.ok+'" aria-label="Set '+(j+1)+' done">'+ic("ck")+'</button>'
    +'<button class="del" data-a="ds" aria-label="Delete set '+(j+1)+'">'+ic("x")+'</button></div>'}).join("")
   +'<div class="row2"><button data-a="as">'+ic("plus")+' Add set</button><button class="rm" data-a="rm">'+ic("trash")+' Remove</button></div></div>':"")+'</section>'}).join("");
 var lib=[];Object.keys(me().tpl).forEach(function(k){me().tpl[k].forEach(function(x){if(lib.indexOf(x[0])<0)lib.push(x[0])})});
 h+='<div class="addrow"><input id="newex" list="lib" placeholder="Add another exercise" aria-label="Exercise name"><button class="primary" data-a="add">Add</button></div><datalist id="lib">'
  +lib.map(function(n){return'<option value="'+esc(n)+'">'}).join("")+'</datalist>'
  +'<div class="finish"><button class="primary" data-a="home">Finish workout</button></div>';
 return h}
// Backup covers the member who is signed in on this phone. Restore only accepts that member's own backup, and adds missing sessions without touching existing ones.
function exportData(){
 var b=new Blob([JSON.stringify({app:"workout-log",v:2,who:DB.who,s:S.s},null,1)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="workout-log-"+nameOf(me()).replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(a.href)},4000);msg="Backup of "+nameOf(me())+" saved to your downloads ("+S.s.length+" sessions).";render()}
function importData(f){
 var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);
  if(d.app!="workout-log"||!Array.isArray(d.s))throw 0;
  if(d.who&&d.who!=DB.who){msg="That backup belongs to "+(person(d.who)?nameOf(person(d.who)):"another member")+". Switch to them first.";return render()}
  var add=d.s.filter(function(q){return q&&q.date&&q.name&&Array.isArray(q.ex)&&!S.s.some(function(x){return x.date==q.date&&x.name==q.name})});
  S.s=S.s.concat(add);save();msg="Restored "+add.length+" new session"+(add.length==1?"":"s")+" for "+nameOf(me())+".";
 }catch(e){msg="That file isn't a Workout Log backup."}render()};r.readAsText(f)}
function render(){$("app").innerHTML=view=="who"?who():view=="home"?home():work()}
$("app").onclick=function(e){var b=e.target.closest("button[data-a]");if(!b)return;var a=b.dataset.a,c=b.closest("[data-i]"),i=c&&+c.dataset.i,st=b.closest(".set");
 if(a=="exp")return exportData();
 if(a=="pick")return choose(b.dataset.id);
 if(a=="switch"){view="who";ren=null;window.scrollTo(0,0);return render()}
 if(a=="rn"){ren=b.dataset.id;render();var r=$("rn");if(r)r.focus();return}
 if(a=="rnsave"){var v=$("rn").value.trim();if(v)DB.names[b.dataset.id]=v;ren=null;save();return render()}
 if(a=="go")return start(b.dataset.n);
 if(a=="open")return start(0,S.s[+b.dataset.id]);
 if(a=="home"){view="home";window.scrollTo(0,0);return render()}
 if(a=="tg")open[i]=!open[i];
 else if(a=="add"){var n=$("newex").value.trim();if(!n)return $("newex").focus();sess.ex.push(mk(n,3,0));open={};open[sess.ex.length-1]=1}
 else if(a=="rm"){sess.ex.splice(i,1);open={}}
 else if(a=="as"){var E=sess.ex[i],p=E.s[E.s.length-1]||{};E.s.push({w:p.w||"",r:p.r||"",ok:0})}
 else if(a=="ds")sess.ex[i].s.splice(+st.dataset.j,1);
 else if(a=="ok"){var s=sess.ex[i].s[+st.dataset.j];s.ok=s.ok?0:1;
  if(s.ok&&allDone(sess.ex[i])&&i+1<sess.ex.length&&!allDone(sess.ex[i+1])){open[i]=0;open[i+1]=1}} // finished an exercise: open the next
 save();var y=window.scrollY;render();window.scrollTo(0,y)};
$("app").oninput=function(e){var f=e.target.dataset.f;if(!f)return;
 sess.ex[+e.target.closest("[data-i]").dataset.i].s[+e.target.closest(".set").dataset.j][f]=e.target.value;save()};
$("app").onchange=function(e){if(e.target.id=="imp"&&e.target.files[0])importData(e.target.files[0])};
$("app").onkeydown=function(e){if(e.key=="Enter"&&e.target.id=="newex")e.target.nextElementSibling.click();if(e.key=="Enter"&&e.target.id=="rn")e.target.nextElementSibling.click()};
load();render();
if("serviceWorker" in navigator){
 // when a new version takes over, reload once so you see it straight away (your logs are saved as you type)
 var hadSW=!!navigator.serviceWorker.controller,reloaded=false;
